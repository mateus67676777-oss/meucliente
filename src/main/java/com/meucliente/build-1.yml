name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Permissao do gradlew
        run: chmod +x gradlew

      - name: Compilar
        run: ./gradlew build

      - name: Guardar o JAR
        uses: actions/upload-artifact@v4
        with:
          name: meucliente-jar
          path: build/libs/*.jar
